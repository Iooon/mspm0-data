# Transform for UART registers based on UART0 on G350x
transforms:
  - !DeleteUselessEnums

  - !DeleteFieldsets
    from: .*
    useless: true

  # However DeleteUselessEnums does not delete MIS and IMASK (due to CLR being 0 and SET being 1)
  #
  # TODO: Add this to chiptool
  - !DeleteEnumsWithVariants
    variants:
      0: CLR
      1: SET

  # Not sure if useless
  - !DeleteEnumsWithVariants
    variants:
      0: NO_EFFECT
      1: CLR

  # Not sure if useless
  - !DeleteEnumsWithVariants
    variants:
      0: NO_EFFECT
      1: SET

  # POWER is useless
  - !DeleteEnumsWithVariants
    variants:
      0: DISABLE
      1: ENABLE

  # RESETASSERT is useless
  - !DeleteEnumsWithVariants
    variants:
      0: NOP
      1: ASSERT

  # RESETSTKY is useless
  - !DeleteEnumsWithVariants
    variants:
      0: NORES
      1: RESET

  # RESETSTKYCLR is useless
  - !DeleteEnumsWithVariants
    variants:
      0: NOP
      1: CLR

  # STOPREQ_HW_OVR is useless
  - !DeleteEnumsWithVariants
    variants:
      0: RESET
      1: SET

  # RX is useless
  - !DeleteEnumsWithVariants
    variants:
      0: DOMINANT
      1: RECESSIVE

  # TODO: Something better than a cursed rename as merge
  - !MergeBlocks
    from: CANFD0
    main: CANFD0
    to: CANFD

  # Remove prefixes
  - !RenameRegisters
    block: .*
    from: CANFD0_(.+)
    to: $1

  - !RenameFields
    fieldset: .*
    from: CANFD0_(.+)
    to: $1

  - !Rename
    type: All
    from: CANFD0_(.+)
    to: $1

  # Remove prefixes
  - !RenameRegisters
    block: .*
    from: MCAN_(.+)
    to: $1

  - !RenameFields
    fieldset: .*
    from: MCAN_(.+)
    to: $1

  - !Rename
    type: All
    from: MCAN_(.+)
    to: $1

  ## Interrupts
  ## INT_EVENT0 -> CPU_INT
  - !MergeBlocks
    from: INT_EVENT0
    main: INT_EVENT0
    to: CPU_INT

  - !RenameRegisters
    block: .*
    from: INT_EVENT0(.*)
    to: CPU_INT$1

  - !RenameFields
    fieldset: .*
    from: INT_EVENT0(.+)
    to: CPU_INT$1

  - !Rename
    type: All
    from: INT_EVENT0(.+)
    to: CPU_INT$1

  # These interrupt fields are all the same layout.
  - !MergeFieldsets
    from: CPU_INT_(IMASK|ISET|MIS|RIS|ICLR)
    to: CPU_INT
    check: NoCheck

  # Remove redundant prefixes in the CPU_INT block
  - !RenameRegisters
    block: .*
    from: CPU_INT_(.+)
    to: $1

  - !RenameFields
    fieldset: .*
    from: CPU_INT_(.+)
    to: $1

  ## Add missing keys
  - !AddFields
    fieldset: RSTCTL
    fields:
    - name: KEY
      description: Unlock key B1h = KEY to allow write access to this register
      bit_offset: 24
      bit_size: 8
      enum: RESET_KEY

  - !AddFields
    fieldset: PWREN
    fields:
    - name: KEY
      description: KEY to allow Power State Change 26h = KEY to allow write access to this register
      bit_offset: 24
      bit_size: 8
      enum: PWREN_KEY

  - !Add
    ir:
      enum/RESET_KEY:
        bit_size: 8
        variants:
          - name: KEY
            value: 177
      enum/PWREN_KEY:
        bit_size: 8
        variants:
          - name: KEY
            value: 38

  ## EVT_MODE
  # Merge INTx_CFG enums
  - !MergeEnums
    from: INT(\d+)_CFG
    to: INT_CFG

  # Rename fields to match interrupt names
  - !RenameFields
    fieldset: EVT_MODE
    from: INT0_CFG
    to: CPU

  ## Cleanup
  - !Sort
